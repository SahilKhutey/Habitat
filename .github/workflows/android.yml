name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android-ci:
    name: Validate Android Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze & Test
        working-directory: apps/mobile
        run: |
          flutter analyze --no-fatal-infos || true
          flutter test || true

      - name: Build Android APK (Debug CI)
        working-directory: apps/mobile
        run: flutter build apk --debug
