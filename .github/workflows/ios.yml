name: iOS Release Archive

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    name: Validate iOS Build
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Verify Xcode Project Structure
        working-directory: apps/mobile
        run: |
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile

      - name: Format Verification
        working-directory: apps/mobile
        run: dart format lib test

      - name: Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build iOS App Framework
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign --no-tree-shake-icons
