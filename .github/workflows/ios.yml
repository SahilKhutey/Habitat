name: iOS Release Archive

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build iOS App Framework
        run: |
          cd apps/mobile
          flutter build ios --release --no-codesign --no-tree-shake-icons
