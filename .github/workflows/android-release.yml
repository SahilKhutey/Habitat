name: Habitat Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build & Release Habitat Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter Project
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Release APK
        working-directory: apps/mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release Artifact
        run: |
          mkdir -p release/android
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            release/android/Habitat-${GITHUB_REF_NAME}-android.apk

      - name: Generate SHA256
        run: |
          sha256sum \
            release/android/Habitat-${GITHUB_REF_NAME}-android.apk \
            > release/android/Habitat-${GITHUB_REF_NAME}-android.sha256

      - name: Verify APK Exists
        run: |
          test -f "release/android/Habitat-${GITHUB_REF_NAME}-android.apk"
          ls -lh release/android/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Habitat ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/android/Habitat-${{ github.ref_name }}-android.apk
            release/android/Habitat-${{ github.ref_name }}-android.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
