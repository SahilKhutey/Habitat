version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: habitat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitat_admin
      POSTGRES_PASSWORD: discipline_pass_2026
      POSTGRES_DB: habitat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat_admin -d habitat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Store & Job Queue
  redis:
    image: redis:7-alpine
    container_name: habitat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MinIO S3 Object Storage (Photos & Videos)
  minio:
    image: minio/minio:latest
    container_name: habitat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console UI
    volumes:
      - minio_data:/data

  # 4. MinIO Bucket Initialization Helper
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/habitat-proofs;
      /usr/bin/mc anonymous set download myminio/habitat-proofs;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
