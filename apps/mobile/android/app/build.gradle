plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.habitat.app"
    compileSdk 36
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.habitat.app"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                def cleanProperties = [:]
                keystoreProperties.each { k, v ->
                    def cleanKey = k.toString().replace('\uFEFF', '').trim()
                    cleanProperties[cleanKey] = v ? v.toString().trim() : ''
                }
                
                def storeFilePath = cleanProperties['storeFile']
                if (!storeFilePath) {
                    throw new GradleException("Release signing error: 'storeFile' is not specified in key.properties.")
                }
                def keystoreFile = file(storeFilePath)
                if (!keystoreFile.exists()) {
                    keystoreFile = rootProject.file(storeFilePath)
                }
                if (!keystoreFile.exists()) {
                    throw new GradleException("Release signing error: Keystore file '${storeFilePath}' does not exist.")
                }
                
                def keyAliasVal = cleanProperties['keyAlias']
                def keyPasswordVal = cleanProperties['keyPassword']
                def storePasswordVal = cleanProperties['storePassword']
                
                if (!keyAliasVal || !keyPasswordVal || !storePasswordVal) {
                    throw new GradleException("Release signing error: keyAlias, keyPassword, and storePassword must all be defined in key.properties.")
                }

                keyAlias keyAliasVal
                keyPassword keyPasswordVal
                storeFile keystoreFile
                storePassword storePasswordVal
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        release {
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (!keystorePropertiesFile.exists() || signingConfigs.release.storeFile == null) {
                throw new GradleException("Release build rejected: Valid key.properties signing credentials are required. Debug signing is strictly prohibited for production builds.")
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
}
